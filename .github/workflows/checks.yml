name: Application checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  studio:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install locked dependencies and build
        run: python scripts/setup.py
      - name: Reject committed contract drift
        run: git diff --exit-code -- frontend/schema/contracts.json frontend/src/api/contracts.ts
      - name: Backend and launcher tests
        run: .venv/bin/python -m pytest -q
      - name: Frontend contracts and component tests
        working-directory: frontend
        run: |
          npm run contracts:check
          npm test
      - name: Install test browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Browser journeys
        working-directory: frontend
        run: npm run test:e2e

  firmware:
    # Compiles the canonical sketch for the UNO reference FQBN with the vendored
    # libraries. A successful reference build is not evidence of the actual board.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install locked backend dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check -r backend/requirements.lock
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: 1.3.1
      - name: Install pinned AVR core
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr@1.8.6
      - name: Compile USB-only UNO and USB+SD reference builds with memory report
        run: |
          .venv/bin/python scripts/firmware.py build --reference reference-350
          .venv/bin/python scripts/firmware.py build --reference reference-400
          .venv/bin/python scripts/firmware.py build --fixture
          # The SD job path does not fit an UNO; keep it compiling on a larger reference board.
          .venv/bin/python scripts/firmware.py build --fixture --with-sd --fqbn arduino:avr:mega
